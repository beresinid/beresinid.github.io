<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beresin</title>
<script>
/* link pendek: /beresin/<nama-usaha>, /beresin/i/<id> → aplikasi #/s/<id> */
(function () {
  var p = location.pathname;
  var dasar = location.hostname === 'vamosshott18-cloud.github.io' ? '/beresin/' : '/';
  var sisa = p.slice(dasar.length).replace(/\/+$/, '');
  if (sisa && /^([icm]\/)?[A-Za-z0-9-]{1,40}$/.test(sisa)) location.replace(dasar + '#/s/' + sisa);
  else location.replace(dasar);
})();
</script></head><body style="font-family:system-ui;background:#F4F2F2"><p style="padding:24px">Membuka Beresin…</p></body></html>
